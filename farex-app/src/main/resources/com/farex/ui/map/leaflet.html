<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Shown by com.farex.ui.common.LeafletMap inside a JavaFX WebView.
     Map data: OpenStreetMap tiles. Library: Leaflet 1.9.4, pinned with integrity hashes.
     Needs internet; without it Leaflet never loads and LeafletMap keeps the static picture. -->
<!-- JavaFX's WebKit draws 3D CSS transforms badly: tiles land in the wrong place or not at all.
     This flag (read by Leaflet at load) makes it position tiles with plain 2D transforms. -->
<script>window.L_DISABLE_3D = true;</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #111111; }
  .leaflet-container { font: 12px/1.4 "Segoe UI", Arial, sans-serif; }
  .leaflet-control-attribution { font-size: 9px; }
  .farex-label { background: #111111; color: #ffffff; border: 1px solid #CAFE06;
                 border-radius: 4px; font-weight: 600; box-shadow: none; }
  .farex-label::before { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  if (typeof L !== 'undefined') {
    // Metro Manila until there is something to fit
    // Animations off: in the WebView they leave tiles half drawn
    // Canvas, not SVG: with every QC route that is ~2,000 stop markers, which SVG draws slowly
    var map = L.map('map', { zoomControl: true, zoomAnimation: false, fadeAnimation: false, markerZoomAnimation: false,
                             preferCanvas: true })
               .setView([14.65, 121.05], 12);
    map.attributionControl.setPrefix('Leaflet');   // plain text: a link would navigate the WebView away
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var layer = L.layerGroup().addTo(map);
    var LIME = '#CAFE06';
    var COLORS = ['#3B82F6', '#F97316', '#A855F7', '#14B8A6', '#EF4444', '#EAB308', '#EC4899', '#22C55E'];

    function latlngs(stops) { return stops.map(function (s) { return [s.lat, s.lng]; }); }
    // The line follows the roads when LeafletMap sent a path, else goes stop to stop
    function line(x) { return x.path && x.path.length > 1 ? x.path : latlngs(x.stops); }

    // data = { routes: [{id, stops:[{name,lat,lng}], path:[[lat,lng],...]}], focus: "R1" or null,
    //          trip: [{route, walk, stops:[...], path:[...]}], pin: [{name,lat,lng}] or null }
    window.farexDraw = function (data) {
      layer.clearLayers();
      var hasTrip = data.trip && data.trip.length > 0;
      var many = (data.routes || []).length > 20;      // the whole network: thinner lines, smaller dots
      var fit = [];

      (data.routes || []).forEach(function (r, i) {
        var focused = !hasTrip && data.focus === r.id;
        var dim = hasTrip || (data.focus && !focused);
        var color = COLORS[i % COLORS.length];
        var pts = line(r);
        if (hasTrip && data.riding === r.id) {          // the jeep you are on: its whole route, so you see where it goes
          L.polyline(pts, { color: LIME, weight: 4, opacity: 0.55, dashArray: '8 8' })
            .bindTooltip('Your jeep · route ' + r.id, { sticky: true }).addTo(layer);
          var last = r.stops[r.stops.length - 1];
          L.circleMarker([last.lat, last.lng], { radius: 5, color: '#111111', weight: 2, fillColor: LIME, fillOpacity: 0.8 })
            .bindTooltip('Route ' + r.id + ' ends: ' + last.name, { direction: 'top', className: 'farex-label' }).addTo(layer);
          return;
        }
        // with a trip shown, the rest of the network is faint context only: thin lines, no stop dots
        L.polyline(pts, { color: focused ? LIME : color, weight: focused ? 6 : (many ? 2.5 : 4),
                          opacity: hasTrip ? 0.15 : (dim ? 0.3 : 0.85) })
          .bindTooltip('Route ' + r.id, { sticky: true }).addTo(layer);
        if (hasTrip && many) return;
        r.stops.forEach(function (s) {
          L.circleMarker([s.lat, s.lng], { radius: focused ? 6 : (many ? 2.5 : 4), color: '#111111', weight: 1,
                                           fillColor: focused ? LIME : color, fillOpacity: dim ? 0.35 : 1 })
            .bindTooltip(s.name).addTo(layer);
        });
        if (focused || (!hasTrip && !data.focus && !many)) fit = fit.concat(pts);
      });

      if (hasTrip) {
        var rides = 0;
        data.trip.forEach(function (leg, i) {
          var pts = line(leg);
          if (leg.walk) {                               // walking: dashed white, no marker of its own
            L.polyline(pts, { color: '#FFFFFF', weight: 4, opacity: 0.95, dashArray: '2 8' })
              .bindTooltip('Walk', { sticky: true }).addTo(layer);
          } else {
            L.polyline(pts, { color: LIME, weight: 7, opacity: 0.95 })
              .bindTooltip('Ride ' + leg.route, { sticky: true }).addTo(layer);
            var board = leg.stops[0];
            // the first boarding keeps its label; transfers only on hover, or labels pile up when zoomed out
            L.circleMarker([board.lat, board.lng], { radius: 7, color: '#111111', weight: 2, fillColor: LIME, fillOpacity: 1 })
              .bindTooltip((rides === 0 ? 'Board: ' : 'Transfer to ' + leg.route + ': ') + board.name,
                           { permanent: rides === 0, direction: 'top', className: 'farex-label' }).addTo(layer);
            rides++;
          }
          fit = fit.concat(pts);
        });
        var first = data.trip[0].stops[0];
        if (data.trip[0].walk) {
          L.circleMarker([first.lat, first.lng], { radius: 7, color: LIME, weight: 3, fillColor: '#FFFFFF', fillOpacity: 1 })
            .bindTooltip('Start: ' + first.name, { permanent: true, direction: 'bottom', className: 'farex-label' }).addTo(layer);
        }
        var lastLeg = data.trip[data.trip.length - 1];
        var end = lastLeg.stops[lastLeg.stops.length - 1];
        L.circleMarker([end.lat, end.lng], { radius: 8, color: LIME, weight: 3, fillColor: '#111111', fillOpacity: 1 })
          .bindTooltip('End: ' + end.name, { permanent: true, direction: 'top', className: 'farex-label' }).addTo(layer);
      }

      if (data.pin) {
        var p = data.pin[0];
        L.circleMarker([p.lat, p.lng], { radius: 9, color: '#111111', weight: 3, fillColor: LIME, fillOpacity: 1 })
          .bindTooltip(p.name, { permanent: true, direction: 'top', className: 'farex-label' }).addTo(layer);
        if (!hasTrip && fit.length === 0) fit = [[p.lat, p.lng]];   // a focused route keeps its own fit
      }

      lastFit = fit;
      refit();
    };

    // Tapping the map hands the point to Java (LeafletMap.onPick) as the status text
    // "farex-pick:lat,lng"; cleared straight after so tapping the same spot again still counts.
    // A drag does not count as a tap.
    window.farexTap = function (lat, lng) {
      window.status = 'farex-pick:' + lat + ',' + lng;
      window.status = '';
    };
    var picking = false;
    window.farexEnablePick = function () {
      if (picking) return;
      picking = true;
      map.on('click', function (e) { farexTap(e.latlng.lat, e.latlng.lng); });
    };

    // "You are here" during a tracked trip: its own layer, so farexDraw does not wipe it and moving
    // it does not re-fit the map. Pans only when the dot leaves the view.
    var meLayer = L.layerGroup().addTo(map), meDot = null;
    window.farexMe = function (lat, lng, offRoute) {
      if (lat === null) { meLayer.clearLayers(); meDot = null; return; }
      var style = { radius: 8, color: '#FFFFFF', weight: 3, fillColor: offRoute ? '#EF4444' : '#3B82F6', fillOpacity: 1 };
      if (!meDot) {
        meDot = L.circleMarker([lat, lng], style).bindTooltip('You', { direction: 'right', className: 'farex-label' }).addTo(meLayer);
        map.setView([lat, lng], 15, { animate: false });   // first fix: follow the passenger, street level
        return;
      } else {
        meDot.setLatLng([lat, lng]);
        meDot.setStyle(style);
        meDot.bringToFront();
      }
      if (!map.getBounds().pad(-0.1).contains([lat, lng])) map.panTo([lat, lng], { animate: false });
    };

    // Pixels at the bottom covered by the app's own cards (e.g. "Jeeps passing here"): fits keep clear of them
    var bottomInset = 0, topInset = 0;
    window.farexInset = function (px, top) { bottomInset = px; topInset = top || 0; };

    var lastFit = [];
    function refit() {
      map.invalidateSize();   // measure the real size first, or the fit is for a stale, smaller box
      if (lastFit.length > 1) map.fitBounds(lastFit, { paddingTopLeft: [36, 36 + topInset], paddingBottomRight: [36, 36 + bottomInset], maxZoom: 16 });
      else if (lastFit.length === 1) map.setView(lastFit[0], Math.max(map.getZoom(), 15));
    }

    // The WebView is often sized after the page loads; re-measure and re-fit whenever it changes.
    window.farexResize = function () { refit(); };
    window.addEventListener('resize', refit);
    window.farexReady = true;
  }
</script>
</body>
</html>
